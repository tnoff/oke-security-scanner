apiVersion: batch/v1
kind: CronJob
metadata:
  name: security-scanner
  namespace: default
spec:
  # Run daily at 2 AM UTC
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid  # Don't run concurrent scans
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: security-scanner
        spec:
          serviceAccountName: security-scanner
          restartPolicy: OnFailure
          containers:
          - name: scanner
            image: iad.ocir.io/your-namespace/oke-security-scanner:latest
            imagePullPolicy: Always
            resources:
              requests:
                memory: "512Mi"
                cpu: "500m"
              limits:
                memory: "2Gi"
                cpu: "2000m"
            env:
              # Trivy configuration
              - name: TRIVY_SEVERITY
                valueFrom:
                  secretKeyRef:
                    name: security-scanner-config
                    key: TRIVY_SEVERITY
              - name: TRIVY_TIMEOUT
                valueFrom:
                  secretKeyRef:
                    name: security-scanner-config
                    key: TRIVY_TIMEOUT

              # Scanning configuration
              - name: EXCLUDE_NAMESPACES
                valueFrom:
                  secretKeyRef:
                    name: security-scanner-config
                    key: EXCLUDE_NAMESPACES

              # Discord notifications (optional)
              # - name: DISCORD_WEBHOOK_URL
              #   valueFrom:
              #     secretKeyRef:
              #       name: security-scanner-config
              #       key: DISCORD_WEBHOOK_URL
            volumeMounts:
              - name: trivy-cache
                mountPath: /home/scanner/.cache/trivy
              # Docker config (~/.docker/config.json) — needed for Trivy to
              # pull private images for scanning. (OCIR cleanup's own
              # ~/.oci/config mount lives in packages/ocir_cleanup's own
              # deployment now, not here — see docs/AGENTS.md.)
              - name: docker-config
                mountPath: /home/scanner/.docker
                readOnly: true
          volumes:
            - name: trivy-cache
              emptyDir: {}
            - name: docker-config
              secret:
                secretName: security-scanner-docker-config
                # Secret must contain key `config.json`
                items:
                  - key: config.json
                    path: config.json
                    mode: 0400
