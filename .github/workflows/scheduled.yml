name: Scheduled

# Replaces the GitLab weekly pipeline schedule, deactivated in terraform!256.
# Same cron terraform derived for it, so the cadence is unchanged.

on:
  schedule:
    - cron: '37 8 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    uses: tnoff/github-workflows/.github/workflows/renovate.yml@bad6dacd6d4d75b465314b1ec984efd86cc8f5e6
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  branch-cleanup:
    name: Branch cleanup
    permissions:
      contents: write
      pull-requests: read
    uses: tnoff/github-workflows/.github/workflows/branch-cleanup.yml@bad6dacd6d4d75b465314b1ec984efd86cc8f5e6
    with:
      age_days: 30
      dry_run: false
