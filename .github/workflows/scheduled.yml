name: Scheduled

# Replaces the GitLab weekly pipeline schedule, deactivated in terraform!256.
# Same cron terraform derived for it, so the cadence is unchanged.

on:
  schedule:
    - cron: '37 8 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    uses: tnoff/github-workflows/.github/workflows/renovate.yml@370df8eb59c656d05358d6be7799d7355f6d750e
    secrets:
      renovate_token: ${{ secrets.RENOVATE_TOKEN }}

  branch-cleanup:
    name: Branch cleanup
    permissions:
      contents: write
      pull-requests: read
    uses: tnoff/github-workflows/.github/workflows/branch-cleanup.yml@370df8eb59c656d05358d6be7799d7355f6d750e
    with:
      age_days: 30
      dry_run: false
