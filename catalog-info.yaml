# Backstage catalog descriptor. Discovered automatically -- the portal's GitHub
# provider reads catalog-info.yaml from the default branch of every repo the
# tnoff-backstage App can see, so adding this file is the whole of onboarding.
#
# github.com/project-slug is DERIVED by the portal's
# AnnotateScmSlugEntityProcessor from the location this file was fetched from.
# techdocs-ref is set below now that mkdocs.yml + docs/ exist; the kubernetes
# / grafana selectors still assert targets that don't exist yet, so they stay
# out until those plugins are wired up.
#
# Four library Components now, one per real deployable
# (docs/projects/oke-security-scanner-package-split.md), where there used to
# be one standing in for all three CronJobs' image. Each of the three
# CronJob Components in docker-apps' own catalog-info.yaml should
# dependsOn its own library here, not all three on this one -- that edge
# lives in docker-apps' descriptor, updated separately.
#
# secret-age-tracker's library is named secret-age-tracker-package, not
# secret-age-tracker: Backstage entity identity is (kind, namespace, name),
# spec.type isn't part of it, and docker-apps already has a `Component`
# named secret-age-tracker (its service/CronJob entity) -- same name would
# collide. oke-security-scanner and ocir-cleanup don't have this problem:
# neither collides with its own CronJob's Component name (security-scanner,
# cleanup-all), so neither needed a suffix.
#
# techdocs-ref stays on oke-security-scanner only -- one canonical entity
# per repo should own a given TechDocs site, not all four.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: oke-security-scanner
  description: >-
    Discovers all images actually deployed in OKE and scans each with Trivy, reporting
    over OpenTelemetry. Narrowed to just the scan package (src/) as of the
    oke-security-scanner-package-split project -- cleanup and secret-age-tracking split
    into their own libraries below, since they're now separate installable
    packages/images, not phases of this one.
  annotations:
    backstage.io/techdocs-ref: dir:.
  # `library` rather than `service`, changed once the CronJob Components in docker-apps
  # existed. Same call, same reasoning, as database-backup#226: while nothing in the
  # catalog represented the deployed thing, this entity had to stand in for it.
  #
  # `library` is not limited to pip-installable packages. MMM-BartTimes is `library` and
  # is a MagicMirror JS module baked into magic-mirror-docker's image; the working
  # definition is "a thing other components consume rather than a thing that runs on its
  # own". An image invoked from a CronJob is that.
  #
  # No spec.system, matching database-backup and every other library here. The CronJobs
  # have none either -- see the note in docker-apps' descriptor for why no System was
  # invented for them.
spec:
  type: library
  owner: group:default/admin
  lifecycle: production
  dependsOn:
    - component:default/dappertable
    - component:default/github-workflows
    - component:default/oke-scanner-core
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: oke-scanner-core
  description: >-
    Shared code underneath all three of this repo's other libraries: k8s in-cluster/
    kubeconfig-fallback auth, image discovery (KubernetesClient, the Image dataclass),
    and the low-level Discord webhook client. Never deployed or built into an image on
    its own -- packages/core, installed alongside whichever package actually ships.
spec:
  type: library
  owner: group:default/admin
  lifecycle: production
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: secret-age-tracker-package
  description: >-
    Reports secrets ≥90 days old across OCI IAM credentials, Kubernetes Secrets, and
    operator-tracked admin tfvars (via a layer-1 ledger ConfigMap). Its own package
    (packages/secret_age/) and its own image; no Trivy, no OCIR cleanup code, no
    OpenTelemetry at all (plain stdout logging). See the docs corpus's
    docs/projects/secret-age-tracker.md for the feature itself.
spec:
  type: library
  owner: group:default/admin
  lifecycle: production
  dependsOn:
    - component:default/dappertable
    - component:default/oke-scanner-core
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ocir-cleanup
  description: >-
    Prunes stale OCIR tags beyond a configurable keep_count and removes orphaned
    platform manifests, protecting the deployed tag, latest, and any multi-arch
    sub-manifest digests referenced by kept tags. Its own package
    (packages/ocir_cleanup/) and its own image; no Trivy binary, but does use the
    OpenTelemetry SDK (unlike secret-age-tracker-package -- the cleanup-all CronJob
    genuinely enables OTLP metrics + logs).
spec:
  type: library
  owner: group:default/admin
  lifecycle: production
  dependsOn:
    - component:default/dappertable
    - component:default/oke-scanner-core
