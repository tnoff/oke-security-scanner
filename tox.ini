[tox]
envlist = py311,py312,py313,py314

# packages/core and packages/secret_age are separate installable packages
# (see docs/projects/oke-security-scanner-package-split.md); editable-install
# both alongside the root project so their code is importable and covered in
# the same run.
#
# Each package's tests run as a SEPARATE pytest invocation (three `coverage
# run --parallel-mode` calls, then `coverage combine`), not one combined
# `pytest tests/ packages/*/tests/` call. All three test dirs are named
# `tests` with their own `__init__.py`, and collecting them in one pytest
# invocation raises `ImportPathMismatchError` / "Plugin already registered"
# on the duplicate `tests.conftest` module name. `--import-mode=importlib`
# sidesteps that collision but silently breaks src/ coverage instead: pytest's
# default "prepend" mode inserts the repo root at sys.path[0], which is the
# (undocumented but load-bearing) reason `import src.config` resolves to the
# local source tree rather than the installed site-packages copy;
# `--import-mode=importlib` does not do that, so coverage traces the
# installed copy while reporting against local paths, and every src/ file
# shows 0% despite the tests passing. Separate invocations keep each
# package's own default-mode sys.path behavior intact.
[testenv]
extras = dev
deps =
    -e {toxinidir}/packages/core
    -e {toxinidir}/packages/secret_age
commands =
    coverage erase
    coverage run --parallel-mode --source=src -m pytest tests/ -v
    coverage run --parallel-mode --source=packages/core/src -m pytest packages/core/tests/ -v
    coverage run --parallel-mode --source=packages/secret_age/src -m pytest packages/secret_age/tests/ -v
    coverage combine
    coverage report -m
    coverage xml
    py314: pylint src/ packages/core/src packages/secret_age/src
    py314: bandit -r src/ packages/core/src packages/secret_age/src

[testenv:pylint]
extras = dev
deps =
    -e {toxinidir}/packages/core
    -e {toxinidir}/packages/secret_age
commands = pylint src/ packages/core/src packages/secret_age/src

[testenv:pytest]
extras = dev
deps =
    -e {toxinidir}/packages/core
    -e {toxinidir}/packages/secret_age
commands =
    coverage erase
    coverage run --parallel-mode --source=src -m pytest tests/ -v
    coverage run --parallel-mode --source=packages/core/src -m pytest packages/core/tests/ -v
    coverage run --parallel-mode --source=packages/secret_age/src -m pytest packages/secret_age/tests/ -v
    coverage combine
    coverage report -m
    coverage html

[testenv:bandit]
extras = dev
deps =
    -e {toxinidir}/packages/core
    -e {toxinidir}/packages/secret_age
commands = bandit -r src/ packages/core/src packages/secret_age/src
