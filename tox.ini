[tox]
envlist = py311,py312,py313,py314

# packages/core, packages/secret_age and packages/ocir_cleanup are separate
# installable packages (see
# docs/projects/oke-security-scanner-package-split.md); editable-install all
# three alongside the root project so their code is importable and covered
# in the same run. core[telemetry] pulls in the OpenTelemetry SDK for src/
# and packages/ocir_cleanup, which both need it; secret_age never requests that
# extra and stays free of it.
#
# Each package's tests run as a SEPARATE pytest invocation (four `coverage
# run --parallel-mode` calls, then `coverage combine`), not one combined
# `pytest tests/ packages/*/tests/` call. All four test dirs are named
# `tests` with their own `__init__.py`, and collecting them in one pytest
# invocation raises `ImportPathMismatchError` / "Plugin already registered"
# on the duplicate `tests.conftest` module name. `--import-mode=importlib`
# sidesteps that collision but silently breaks src/ coverage instead: pytest's
# default "prepend" mode inserts the repo root at sys.path[0], which is the
# (undocumented but load-bearing) reason `import src.config` resolves to the
# local source tree rather than the installed site-packages copy;
# `--import-mode=importlib` does not do that, so coverage traces the
# installed copy while reporting against local paths, and every src/ file
# shows 0% despite the tests passing. Separate invocations keep each
# package's own default-mode sys.path behavior intact.
[testenv]
extras = dev
deps =
    -e {toxinidir}/packages/core[telemetry]
    -e {toxinidir}/packages/secret_age
    -e {toxinidir}/packages/ocir_cleanup
commands =
    coverage erase
    coverage run --parallel-mode --source=src -m pytest tests/ -v
    coverage run --parallel-mode --source=packages/core/src -m pytest packages/core/tests/ -v
    coverage run --parallel-mode --source=packages/secret_age/src -m pytest packages/secret_age/tests/ -v
    coverage run --parallel-mode --source=packages/ocir_cleanup/src -m pytest packages/ocir_cleanup/tests/ -v
    coverage combine
    coverage report -m
    coverage xml
    py314: pylint src/ packages/core/src packages/secret_age/src packages/ocir_cleanup/src
    py314: bandit -r src/ packages/core/src packages/secret_age/src packages/ocir_cleanup/src

[testenv:pylint]
extras = dev
deps =
    -e {toxinidir}/packages/core[telemetry]
    -e {toxinidir}/packages/secret_age
    -e {toxinidir}/packages/ocir_cleanup
commands = pylint src/ packages/core/src packages/secret_age/src packages/ocir_cleanup/src

[testenv:pytest]
extras = dev
deps =
    -e {toxinidir}/packages/core[telemetry]
    -e {toxinidir}/packages/secret_age
    -e {toxinidir}/packages/ocir_cleanup
commands =
    coverage erase
    coverage run --parallel-mode --source=src -m pytest tests/ -v
    coverage run --parallel-mode --source=packages/core/src -m pytest packages/core/tests/ -v
    coverage run --parallel-mode --source=packages/secret_age/src -m pytest packages/secret_age/tests/ -v
    coverage run --parallel-mode --source=packages/ocir_cleanup/src -m pytest packages/ocir_cleanup/tests/ -v
    coverage combine
    coverage report -m
    coverage html

[testenv:bandit]
extras = dev
deps =
    -e {toxinidir}/packages/core[telemetry]
    -e {toxinidir}/packages/secret_age
    -e {toxinidir}/packages/ocir_cleanup
commands = bandit -r src/ packages/core/src packages/secret_age/src packages/ocir_cleanup/src
